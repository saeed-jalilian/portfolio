# nginx site for the static export in out/.
# Install: copy to /etc/nginx/sites-available/saeed-jalilian.ir, link it into
# sites-enabled, then run certbot --nginx (it adds HTTPS and the redirect).
#
# nginx drops server-level add_header lines in any location that sets its own,
# so every location with add_header repeats the security headers.
server {
    listen 80;
    listen [::]:80;
    server_name saeed-jalilian.ir www.saeed-jalilian.ir;

    root /var/www/saeed-jalilian.ir;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Pages are folders with an index.html (trailingSlash: true), so /en
    # redirects to /en/ and unknown paths get the exported 404 page.
    # HTML is revalidated on every visit so a deploy never leaves a cached
    # page pointing at build files that were removed.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
    error_page 404 /404.html;

    # Hashed build files never change, so browsers can keep them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Next writes these without a file extension nginx knows.
    location = /opengraph-image {
        default_type image/png;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json application/manifest+json;
}
